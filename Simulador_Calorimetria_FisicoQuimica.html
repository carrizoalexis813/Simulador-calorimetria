<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Calorimetría y Equilibrio Térmico</title>
    <!-- React & ReactDOM CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel CDN for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-100 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const MATERIALS = {
            agua: { name: 'Agua (H₂O)', c: 1.0, color: 'bg-blue-500', particleColor: '#3b82f6', state: 'liquid' },
            leche: { name: 'Leche Entera', c: 0.93, color: 'bg-amber-100 border border-amber-300', particleColor: '#fef3c7', state: 'liquid' },
            aceite: { name: 'Aceite Vegetal', c: 0.47, color: 'bg-yellow-400', particleColor: '#facc15', state: 'liquid' },
            aluminio: { name: 'Aluminio (Al)', c: 0.215, color: 'bg-slate-300', particleColor: '#cbd5e1', state: 'solid' },
            hierro: { name: 'Hierro (Fe)', c: 0.113, color: 'bg-slate-600', particleColor: '#475569', state: 'solid' },
            cobre: { name: 'Cobre (Cu)', c: 0.092, color: 'bg-amber-700', particleColor: '#b45309', state: 'solid' },
        };

        function CalorimetrySimulator() {
            const [activeTab, setActiveTab] = useState('single');

            // --- TAB 1: Single Material Heating ---
            const [mat1Key, setMat1Key] = useState('agua');
            const [mass1, setMass1] = useState(200); // g
            const [temp1, setTemp1] = useState(20); // °C
            const [burnerPower, setBurnerPower] = useState(0); // 0 (off), 1 (low), 2 (med), 3 (high)
            const [heatAdded, setHeatAdded] = useState(0); // cal

            // --- TAB 2: Thermal Equilibrium ---
            const [eqMat1, setEqMat1] = useState('hierro');
            const [eqMass1, setEqMass1] = useState(100);
            const [eqTemp1, setEqTemp1] = useState(90);

            const [eqMat2, setEqMat2] = useState('agua');
            const [eqMass2, setEqMass2] = useState(200);
            const [eqTemp2, setEqTemp2] = useState(20);

            const [isEquilibrated, setIsEquilibrated] = useState(false);

            // --- TAB 3: Quiz ---
            const [quizAnswers, setQuizAnswers] = useState({});
            const [quizSubmitted, setQuizSubmitted] = useState(false);

            // Heating simulation effect
            useEffect(() => {
                if (burnerPower === 0) return;
                const interval = setInterval(() => {
                    const addedCal = burnerPower * 50; // calories per step
                    setHeatAdded(prev => prev + addedCal);
                    setTemp1(prevTemp => {
                        const mat = MATERIALS[mat1Key];
                        const dT = addedCal / (mass1 * mat.c);
                        const newTemp = prevTemp + dT;
                        return Math.min(newTemp, 120); // Cap at 120°C for safety demo
                    });
                }, 200);
                return () => clearInterval(interval);
            }, [burnerPower, mat1Key, mass1]);

            // Calculate Equilibrium Temperature
            const matA = MATERIALS[eqMat1];
            const matB = MATERIALS[eqMat2];
            const tEq = (eqMass1 * matA.c * eqTemp1 + eqMass2 * matB.c * eqTemp2) / (eqMass1 * matA.c + eqMass2 * matB.c);
            const qTransferred = eqMass1 * matA.c * Math.abs(eqTemp1 - tEq);

            const resetSingle = () => {
                setBurnerPower(0);
                setTemp1(20);
                setHeatAdded(0);
            };

            // Quiz questions
            const questions = [
                {
                    id: 'q1',
                    text: '1. ¿Qué sustancia requiere MÁS energía para elevar su temperatura 1 °C por cada gramo?',
                    options: [
                        { key: 'a', text: 'Hierro (c = 0.113 cal/g°C)' },
                        { key: 'b', text: 'Agua (c = 1.000 cal/g°C)', correct: true },
                        { key: 'c', text: 'Aluminio (c = 0.215 cal/g°C)' }
                    ]
                },
                {
                    id: 'q2',
                    text: '2. Si sumergimos una barra de hierro a 90 °C en agua a 20 °C, ¿hacia dónde fluye el calor espontáneamente?',
                    options: [
                        { key: 'a', text: 'Del agua fría al hierro caliente' },
                        { key: 'b', text: 'Del hierro caliente al agua fría', correct: true },
                        { key: 'c', text: 'No hay flujo de calor entre ellos' }
                    ]
                },
                {
                    id: 'q3',
                    text: '3. Si el calor específico del aceite (0.47) es la mitad que el del agua (1.0), al calentar 100g de cada uno con la misma llama durante 1 minuto:',
                    options: [
                        { key: 'a', text: 'El aceite alcanzará una mayor temperatura', correct: true },
                        { key: 'b', text: 'El agua alcanzará una mayor temperatura' },
                        { key: 'c', text: 'Ambos alcanzarán exactamente la misma temperatura' }
                    ]
                }
            ];

            const handleQuizSelect = (qId, optionKey) => {
                setQuizAnswers(prev => ({ ...prev, [qId]: optionKey }));
            };

            return (
                <div class="max-w-5xl mx-auto p-4 md:p-6 font-sans">
                    {/* Header */}
                    <header class="bg-slate-800 text-white p-6 rounded-2xl shadow-xl mb-6">
                        <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                            <div>
                                <span class="bg-blue-500 text-xs font-semibold px-3 py-1 rounded-full uppercase tracking-wider">
                                    3° Año ETP - Físico-Química & Alimentos
                                </span>
                                <h1 class="text-2xl md:text-3xl font-bold mt-2">Simulador de Calorimetría y Equilibrio Térmico</h1>
                                <p class="text-slate-300 text-sm mt-1">
                                    Explorá la inercia térmica de los alimentos y metales ($Q = m \cdot c \cdot \Delta T$)
                                </p>
                            </div>
                            <div class="bg-slate-700/80 p-3 rounded-xl border border-slate-600 text-right">
                                <span class="text-xs text-slate-400 block">Equivalencia Clave:</span>
                                <span class="text-lg font-mono font-bold text-amber-400">1 cal = 4.184 J</span>
                            </div>
                        </div>

                        {/* Navigation Tabs */}
                        <div class="flex gap-2 mt-6 border-b border-slate-700 pb-2 overflow-x-auto">
                            <button
                                onClick={() => setActiveTab('single')}
                                class={`px-4 py-2 rounded-lg font-medium text-sm transition-all flex items-center gap-2 ${
                                    activeTab === 'single' ? 'bg-blue-600 text-white shadow-lg' : 'text-slate-400 hover:bg-slate-700'
                                }`}
                            >
                                🔥 1. Calentamiento & Partículas
                            </button>
                            <button
                                onClick={() => setActiveTab('equilibrium')}
                                class={`px-4 py-2 rounded-lg font-medium text-sm transition-all flex items-center gap-2 ${
                                    activeTab === 'equilibrium' ? 'bg-blue-600 text-white shadow-lg' : 'text-slate-400 hover:bg-slate-700'
                                }`}
                            >
                                🧪 2. Equilibrio Térmico
                            </button>
                            <button
                                onClick={() => setActiveTab('quiz')}
                                class={`px-4 py-2 rounded-lg font-medium text-sm transition-all flex items-center gap-2 ${
                                    activeTab === 'quiz' ? 'bg-blue-600 text-white shadow-lg' : 'text-slate-400 hover:bg-slate-700'
                                }`}
                            >
                                🎯 3. Desafío de Cierre
                            </button>
                        </div>
                    </header>

                    {/* TAB 1: SINGLE MATERIAL HEATING */}
                    {activeTab === 'single' && (
                        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                            {/* Controls Panel */}
                            <div class="bg-white p-6 rounded-2xl shadow-md border border-slate-200 flex flex-col justify-between">
                                <div>
                                    <h2 class="text-lg font-bold text-slate-800 mb-4 pb-2 border-b">Parámetros del Sistema</h2>

                                    {/* Material selection */}
                                    <div class="mb-4">
                                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-2">Sustancia / Alimento</label>
                                        <select
                                            value={mat1Key}
                                            onChange={(e) => { setMat1Key(e.target.value); resetSingle(); }}
                                            class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2.5 font-medium text-slate-700 focus:ring-2 focus:ring-blue-500"
                                        >
                                            <optgroup label="Alimentos & Líquidos">
                                                <option value="agua">Agua (c = 1.000 cal/g°C)</option>
                                                <option value="leche">Leche Entera (c = 0.930 cal/g°C)</option>
                                                <option value="aceite">Aceite Vegetal (c = 0.470 cal/g°C)</option>
                                            </optgroup>
                                            <optgroup label="Metales (Taller / Estructura)">
                                                <option value="aluminio">Aluminio (c = 0.215 cal/g°C)</option>
                                                <option value="hierro">Hierro (c = 0.113 cal/g°C)</option>
                                                <option value="cobre">Cobre (c = 0.092 cal/g°C)</option>
                                            </optgroup>
                                        </select>
                                    </div>

                                    {/* Mass slider */}
                                    <div class="mb-5">
                                        <div class="flex justify-between items-center mb-1">
                                            <label class="text-xs font-semibold text-slate-600 uppercase">Masa (m)</label>
                                            <span class="font-mono font-bold text-blue-600">{mass1} g</span>
                                        </div>
                                        <input
                                            type="range" min="50" max="500" step="25"
                                            value={mass1}
                                            onChange={(e) => { setMass1(Number(e.target.value)); resetSingle(); }}
                                            class="w-full accent-blue-600 cursor-pointer"
                                        />
                                    </div>

                                    {/* Burner Controls */}
                                    <div class="mb-5">
                                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-2">Potencia del Mechero</label>
                                        <div class="grid grid-cols-4 gap-2">
                                            {[0, 1, 2, 3].map(p => (
                                                <button
                                                    key={p}
                                                    onClick={() => setBurnerPower(p)}
                                                    class={`py-2 rounded-lg font-bold text-xs transition-all ${
                                                        burnerPower === p 
                                                            ? p === 0 ? 'bg-slate-700 text-white' : 'bg-red-500 text-white shadow-md' 
                                                            : 'bg-slate-100 text-slate-700 hover:bg-slate-200'
                                                    }`}
                                                >
                                                    {p === 0 ? 'Apagado' : `Nivel ${p}`}
                                                </button>
                                            ))}
                                        </div>
                                    </div>
                                </div>

                                <button
                                    onClick={resetSingle}
                                    class="w-full bg-slate-200 hover:bg-slate-300 text-slate-700 font-semibold py-2.5 rounded-lg text-sm transition-all"
                                >
                                    🔄 Reiniciar Temperatura
                                </button>
                            </div>

                            {/* Simulation Container */}
                            <div class="lg:col-span-2 bg-white p-6 rounded-2xl shadow-md border border-slate-200 flex flex-col justify-between">
                                {/* Visor & Molecule animation */}
                                <div class="relative bg-slate-900 rounded-xl h-64 overflow-hidden flex items-end justify-center p-4">
                                    {/* Thermometer Overlay */}
                                    <div class="absolute top-4 left-4 bg-slate-800/90 backdrop-blur-md p-3 rounded-xl border border-slate-700 text-white font-mono">
                                        <div class="text-xs text-slate-400">Temperatura (T)</div>
                                        <div class="text-2xl font-bold text-red-400">{temp1.toFixed(1)} °C</div>
                                        <div class="text-xs text-slate-400 mt-1">{(temp1 + 273.15).toFixed(1)} K</div>
                                    </div>

                                    {/* Heat added indicator */}
                                    <div class="absolute top-4 right-4 bg-slate-800/90 backdrop-blur-md p-3 rounded-xl border border-slate-700 text-white font-mono text-right">
                                        <div class="text-xs text-slate-400">Calor Suministrado (Q)</div>
                                        <div class="text-lg font-bold text-amber-400">{Math.round(heatAdded)} cal</div>
                                        <div class="text-xs text-slate-400">{(heatAdded * 4.184).toFixed(0)} J</div>
                                    </div>

                                    {/* Beaker / Material representation */}
                                    <div class={`w-48 transition-all rounded-b-xl relative flex items-center justify-center border-b-4 border-slate-400 overflow-hidden ${MATERIALS[mat1Key].color}`}
                                         style={{ height: `${Math.min(mass1 / 2.5 + 40, 180)}px` }}>
                                        
                                        {/* Particle Agitation Effect */}
                                        <div class="absolute inset-0 grid grid-cols-4 gap-2 p-3 opacity-70">
                                            {Array.from({ length: 12 }).map((_, i) => (
                                                <div
                                                    key={i}
                                                    class="w-3 h-3 rounded-full bg-white shadow-sm"
                                                    style={{
                                                        animation: `bounce ${Math.max(0.1, 1.5 - (temp1 / 80))}s infinite ease-in-out alternate`
                                                    }}
                                                />
                                            ))}
                                        </div>
                                        <span class="relative z-10 bg-slate-900/80 text-white text-xs px-2 py-1 rounded font-mono font-bold">
                                            {MATERIALS[mat1Key].name}
                                        </span>
                                    </div>

                                    {/* Burner Flame Animation */}
                                    {burnerPower > 0 && (
                                        <div class="absolute bottom-0 flex gap-1 items-end animate-pulse">
                                            <div class={`bg-amber-500 rounded-t-full transition-all ${burnerPower === 1 ? 'w-4 h-6' : burnerPower === 2 ? 'w-8 h-10' : 'w-12 h-14'}`} />
                                            <div class={`bg-red-500 rounded-t-full transition-all ${burnerPower === 1 ? 'w-6 h-8' : burnerPower === 2 ? 'w-10 h-12' : 'w-16 h-16'}`} />
                                            <div class={`bg-yellow-400 rounded-t-full transition-all ${burnerPower === 1 ? 'w-4 h-6' : burnerPower === 2 ? 'w-8 h-10' : 'w-12 h-14'}`} />
                                        </div>
                                    )}
                                </div>

                                {/* Mathematical Formula Breakdown */}
                                <div class="mt-4 bg-slate-50 p-4 rounded-xl border border-slate-200">
                                    <div class="text-xs font-bold text-slate-500 uppercase tracking-wide mb-2">Desglose de la Ecuación Fundamental:</div>
                                    <div class="flex flex-wrap items-center gap-2 font-mono text-sm md:text-base">
                                        <span class="font-bold text-amber-600">Q =</span>
                                        <span class="bg-white px-2 py-1 rounded border text-blue-600 font-bold">{mass1} g</span>
                                        <span>×</span>
                                        <span class="bg-white px-2 py-1 rounded border text-emerald-600 font-bold">{MATERIALS[mat1Key].c} cal/g°C</span>
                                        <span>×</span>
                                        <span class="bg-white px-2 py-1 rounded border text-red-600 font-bold">{(temp1 - 20).toFixed(1)} °C</span>
                                        <span>=</span>
                                        <span class="bg-amber-100 text-amber-800 font-bold px-3 py-1 rounded-lg border border-amber-300">
                                            {Math.round(mass1 * MATERIALS[mat1Key].c * (temp1 - 20))} cal
                                        </span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* TAB 2: THERMAL EQUILIBRIUM */}
                    {activeTab === 'equilibrium' && (
                        <div class="bg-white p-6 rounded-2xl shadow-md border border-slate-200">
                            <h2 class="text-lg font-bold text-slate-800 mb-2">Mezcla e Intercambio Térmico (Sistema Aislado)</h2>
                            <p class="text-slate-600 text-sm mb-6">
                                Al mezclar dos sustancias a distinta temperatura, el cuerpo caliente cede calor al frío hasta alcanzar la <strong class="text-blue-600">Temperatura de Equilibrio ($T_{eq}$)</strong> donde $Q_{ganado} = -Q_{perdido}$.
                            </p>

                            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                                {/* Substance A (Hot Body) */}
                                <div class="bg-red-50 p-5 rounded-xl border border-red-200">
                                    <div class="flex items-center justify-between mb-3">
                                        <span class="text-xs font-bold bg-red-200 text-red-800 px-2 py-1 rounded uppercase">Cuerpo 1 (Caliente)</span>
                                        <span class="font-mono font-bold text-red-600">{eqTemp1} °C</span>
                                    </div>
                                    <div class="space-y-3">
                                        <div>
                                            <label class="text-xs font-semibold text-slate-600">Sustancia A</label>
                                            <select
                                                value={eqMat1}
                                                onChange={(e) => setEqMat1(e.target.value)}
                                                class="w-full bg-white border border-red-200 rounded-lg p-2 text-sm font-medium mt-1"
                                            >
                                                {Object.keys(MATERIALS).map(k => (
                                                    <option key={k} value={k}>{MATERIALS[k].name} (c={MATERIALS[k].c})</option>
                                                ))}
                                            </select>
                                        </div>
                                        <div>
                                            <label class="text-xs font-semibold text-slate-600">Masa: {eqMass1} g</label>
                                            <input
                                                type="range" min="50" max="500" step="25" value={eqMass1}
                                                onChange={(e) => setEqMass1(Number(e.target.value))}
                                                class="w-full accent-red-600"
                                            />
                                        </div>
                                        <div>
                                            <label class="text-xs font-semibold text-slate-600">Temp Inicial: {eqTemp1} °C</label>
                                            <input
                                                type="range" min="40" max="100" step="5" value={eqTemp1}
                                                onChange={(e) => setEqTemp1(Number(e.target.value))}
                                                class="w-full accent-red-600"
                                            />
                                        </div>
                                    </div>
                                </div>

                                {/* Substance B (Cold Body) */}
                                <div class="bg-blue-50 p-5 rounded-xl border border-blue-200">
                                    <div class="flex items-center justify-between mb-3">
                                        <span class="text-xs font-bold bg-blue-200 text-blue-800 px-2 py-1 rounded uppercase">Cuerpo 2 (Frío)</span>
                                        <span class="font-mono font-bold text-blue-600">{eqTemp2} °C</span>
                                    </div>
                                    <div class="space-y-3">
                                        <div>
                                            <label class="text-xs font-semibold text-slate-600">Sustancia B</label>
                                            <select
                                                value={eqMat2}
                                                onChange={(e) => setEqMat2(e.target.value)}
                                                class="w-full bg-white border border-blue-200 rounded-lg p-2 text-sm font-medium mt-1"
                                            >
                                                {Object.keys(MATERIALS).map(k => (
                                                    <option key={k} value={k}>{MATERIALS[k].name} (c={MATERIALS[k].c})</option>
                                                ))}
                                            </select>
                                        </div>
                                        <div>
                                            <label class="text-xs font-semibold text-slate-600">Masa: {eqMass2} g</label>
                                            <input
                                                type="range" min="50" max="500" step="25" value={eqMass2}
                                                onChange={(e) => setEqMass2(Number(e.target.value))}
                                                class="w-full accent-blue-600"
                                            />
                                        </div>
                                        <div>
                                            <label class="text-xs font-semibold text-slate-600">Temp Inicial: {eqTemp2} °C</label>
                                            <input
                                                type="range" min="0" max="35" step="5" value={eqTemp2}
                                                onChange={(e) => setEqTemp2(Number(e.target.value))}
                                                class="w-full accent-blue-600"
                                            />
                                        </div>
                                    </div>
                                </div>
                            </div>

                            {/* Equilibrium Result Box */}
                            <div class="bg-gradient-to-r from-slate-900 to-slate-800 text-white p-6 rounded-xl shadow-lg border border-slate-700">
                                <div class="flex flex-col md:flex-row justify-between items-center gap-4">
                                    <div>
                                        <span class="text-xs text-amber-400 font-bold uppercase tracking-wider block">Resultado Teórico de Mezcla</span>
                                        <div class="text-3xl font-extrabold text-white mt-1">
                                            T<sub>eq</sub> = <span class="text-emerald-400">{tEq.toFixed(2)} °C</span>
                                        </div>
                                        <p class="text-xs text-slate-300 mt-1">
                                            Energía intercambiada: <strong class="text-amber-300">{Math.round(qTransferred)} cal</strong> ({(qTransferred * 4.184).toFixed(0)} J)
                                        </p>
                                    </div>
                                    <div class="bg-slate-800/90 p-4 rounded-xl border border-slate-700 text-xs font-mono max-w-md">
                                        <div class="text-slate-400 mb-1">// Ecuación de Balance:</div>
                                        <div class="text-slate-200">m₁ · c₁ · (T₁ - T<sub>eq</sub>) = m₂ · c₂ · (T<sub>eq</sub> - T₂)</div>
                                        <div class="text-emerald-400 mt-2">
                                            {eqMass1}×{matA.c}×({eqTemp1} - {tEq.toFixed(1)}) = {eqMass2}×{matB.c}×({tEq.toFixed(1)} - {eqTemp2})
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* TAB 3: QUIZ */}
                    {activeTab === 'quiz' && (
                        <div class="bg-white p-6 rounded-2xl shadow-md border border-slate-200">
                            <h2 class="text-lg font-bold text-slate-800 mb-2">Desafío de Cierre - Comprobación de Conceptos</h2>
                            <p class="text-slate-600 text-sm mb-6">
                                Responded a las siguientes preguntas para evaluar lo aprendido en la clase de hoy.
                            </p>

                            <div class="space-y-6">
                                {questions.map(q => (
                                    <div key={q.id} class="bg-slate-50 p-5 rounded-xl border border-slate-200">
                                        <h3 class="font-bold text-slate-800 text-sm md:text-base mb-3">{q.text}</h3>
                                        <div class="space-y-2">
                                            {q.options.map(opt => {
                                                const isSelected = quizAnswers[q.id] === opt.key;
                                                let btnClass = 'w-full text-left p-3 rounded-lg border text-sm font-medium transition-all ';
                                                if (quizSubmitted) {
                                                    if (opt.correct) btnClass += 'bg-emerald-100 border-emerald-500 text-emerald-900 font-bold';
                                                    else if (isSelected && !opt.correct) btnClass += 'bg-red-100 border-red-500 text-red-900';
                                                    else btnClass += 'bg-white border-slate-200 opacity-60';
                                                } else {
                                                    btnClass += isSelected ? 'bg-blue-600 text-white border-blue-600' : 'bg-white border-slate-200 hover:bg-slate-100 text-slate-700';
                                                }
                                                return (
                                                    <button
                                                        key={opt.key}
                                                        onClick={() => !quizSubmitted && handleQuizSelect(q.id, opt.key)}
                                                        class={btnClass}
                                                    >
                                                        {opt.text}
                                                    </button>
                                                );
                                            })}
                                        </div>
                                    </div>
                                ))}
                            </div>

                            <div class="mt-6 flex justify-end gap-3">
                                {quizSubmitted ? (
                                    <button
                                        onClick={() => { setQuizSubmitted(false); setQuizAnswers({}); }}
                                        class="bg-slate-700 text-white font-bold px-6 py-2.5 rounded-xl hover:bg-slate-800 transition-all text-sm"
                                    >
                                        Reintentar Quiz
                                    </button>
                                ) : (
                                    <button
                                        onClick={() => setQuizSubmitted(true)}
                                        disabled={Object.keys(quizAnswers).length < questions.length}
                                        class="bg-emerald-600 disabled:opacity-50 text-white font-bold px-6 py-2.5 rounded-xl hover:bg-emerald-700 transition-all text-sm"
                                    >
                                        Verificar Respuestas
                                    </button>
                                )}
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<CalorimetrySimulator />);
    </script>
</body>
</html>
